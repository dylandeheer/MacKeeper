name: MacKeeper checks

on:
  push:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
      - run: ./gradlew test installDist --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-linux
          path: build/reports/tests/test
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
      - run: scripts/package-macos.sh
      - name: Verify bundled launcher without proprietary assets
        run: |
          app=$(find build/macos -name MacKeeper.app -type d -print -quit)
          "$app/Contents/MacOS/MacKeeper" --help
          ditto -c -k --keepParent "$app" build/MacKeeper-macos-dev.zip
      - uses: actions/upload-artifact@v4
        with:
          name: MacKeeper-macos-dev
          path: build/MacKeeper-macos-dev.zip
